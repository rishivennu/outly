<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Outlly phone check</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0d0d10; color: #f4f4f5; font: 15px/1.5 -apple-system, system-ui, Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 18px 40px; }
  h1 { font-size: 22px; margin: 4px 0 6px; text-wrap: balance; }
  p { color: #c4c4cc; margin: 0 0 16px; }
  ol { list-style: none; padding: 0; margin: 0 0 20px; border-top: 1px solid #2a2a31; }
  li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid #2a2a31; }
  li b { font-weight: 600; }
  li small { grid-column: 1 / -1; color: #a1a1aa; font-size: 13px; word-break: break-word; }
  .ok { color: #b6f35a; } .bad { color: #ff8a80; } .wait { color: #a1a1aa; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  button, a.btn { font: inherit; font-weight: 600; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #3a3a44; background: #1b1b21; color: #f4f4f5; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
  button.primary { background: #c4ff00; border-color: #c4ff00; color: #0d0d10; }
  button:focus-visible, a.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  pre { white-space: pre-wrap; word-break: break-word; background: #16161b; border: 1px solid #2a2a31; border-radius: 12px; padding: 12px; font: 12px/1.45 ui-monospace, Menlo, monospace; color: #d4d4d8; }
</style>
</head>
<body>
<main>
  <h1>Outlly phone check</h1>
  <p>This page tests the dashboard from your phone and shows what goes wrong. Take a screenshot of the whole list and send it over.</p>
  <ol id="list" aria-live="polite"></ol>
  <div class="row">
    <button class="primary" id="copy" type="button">Copy the report</button>
    <a class="btn" href="/home">Open the dashboard</a>
  </div>
  <div class="row">
    <button id="reset" type="button">Clear Outlly's saved data on this phone</button>
  </div>
  <pre id="out">Running…</pre>
</main>
<script src="/check.js"></script>
</body>
</html>
