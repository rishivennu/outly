# Outlly behind nginx: N stateless web instances + one worker (REDIS_URL required).
# Web instances: `next start -p 3041`, `-p 3042`, ... ; worker: `bun run worker`.
upstream outly_app {
    least_conn;
    server 127.0.0.1:3041 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3042 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 60m;          # MAX_UPLOAD_MB=50 plus headroom; big files go straight to Supabase via TUS anyway

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change: cache for a year at the edge and in the browser.
    location /_next/static/ {
        proxy_pass http://outly_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://outly_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;   # GET/HEAD only by default (non_idempotent is off)
        proxy_request_buffering off;                           # stream uploads
    }
}
