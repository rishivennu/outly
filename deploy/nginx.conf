# Outlly behind nginx: N stateless web instances + one worker (REDIS_URL required).
# Web instances: `next start -p 3041`, `-p 3042`, ... ; worker: `bun run worker`.
# On Vercel you do not need any of this: every request is already spread across
# auto-scaled serverless instances behind Vercel's own edge network.

# Static build assets are cached on this box so a traffic spike never reaches Node for them.
proxy_cache_path /var/cache/nginx/outlly levels=1:2 keys_zone=outlly_static:20m max_size=1g inactive=7d use_temp_path=off;

# Per-IP limits: generous for pages, tighter for the API (the app has its own limits too).
limit_req_zone $binary_remote_addr zone=outlly_api:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=outlly_conn:20m;

upstream outly_app {
    least_conn;
    server 127.0.0.1:3041 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3042 max_fails=2 fail_timeout=10s;
    # server 127.0.0.1:3043 max_fails=2 fail_timeout=10s;   # add one line per instance
    keepalive 64;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 60m;          # MAX_UPLOAD_MB=50 plus headroom; big files go straight to Supabase via TUS anyway
    limit_conn outlly_conn 60;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;          # a dead instance is skipped fast
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;   # GET/HEAD only by default (non_idempotent is off)
    proxy_next_upstream_tries 2;

    # Hashed build assets never change: cache for a year at the edge and in the browser.
    location /_next/static/ {
        proxy_pass http://outly_app;
        proxy_cache outlly_static;
        proxy_cache_valid 200 365d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_req zone=outlly_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://outly_app;
        proxy_request_buffering off;                           # stream uploads
    }

    location / {
        proxy_pass http://outly_app;
        proxy_request_buffering off;
    }
}
